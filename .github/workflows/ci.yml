name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tests are fully offline (LLM disabled in conftest, no DB/browser), so no services
      # are needed. [api] is NOT optional here despite being an optional extra: test_auth.py
      # and test_payments.py open with `pytest.importorskip("fastapi")` / `("jwt")`, so
      # installing only [dev] made the entire auth + payments suite SKIP — silently, with a
      # green tick. Those are the security-critical suites in this repo.
      - name: Install
        run: pip install -e ".[api,dev]"

      # Belt and braces: if this import ever fails, the suites above go back to skipping
      # quietly. Fail loudly here instead, where the cause is unmistakable.
      - name: Guard — auth/payments suites must be runnable, not skippable
        run: python -c "import fastapi, jwt, cryptography; print('auth+payments deps present')"

      - name: Lint
        run: ruff check src tests

      # Incremental typing gate: the modules below are kept mypy-clean (the hybrid LLM
      # layer, the agentic loop, startup validation, the DB seam). Widen this list as
      # more of the codebase is annotated — never narrow it.
      - name: Typecheck
        run: >-
          mypy
          src/aeo/startup.py
          src/aeo/nlp/providers.py
          src/aeo/nlp/llm.py
          src/aeo/agents/react.py
          src/aeo/agents/tools.py
          src/aeo/agents/runtime.py
          src/aeo/storage/repos/embeddings.py
          src/aeo/storage/db.py
          src/aeo/pipeline/embed_index.py

      # -ra surfaces the skip reasons in the log; a suite that quietly stops running is the
      # failure mode this job has already had once.
      - name: Test
        run: pytest -q -ra

  # Exercises the migrations 0001-0009 + DB-gated integration tests against a real
  # Postgres (the offline `test` job skips these). Closes the "first deploy is the
  # first real migration" gap flagged in the architecture review.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeo
          POSTGRES_PASSWORD: aeo
          POSTGRES_DB: aeo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aeo:aeo@localhost:5432/aeo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # [api] for the same reason the `test` job needs it, one step further on. The P5
      # ticket-ownership tests reach the routes through `aeo.api.app`, which imports fastapi
      # (and, via .auth, pyjwt) at module scope — and unlike the auth/payments suites they do
      # NOT guard that with importorskip. So `.[dev]` alone did not skip them, it ERRORED
      # them: four ModuleNotFoundError failures that had gone red on every run since
      # 2026-08-04, taking the `image` job (needs: [test, migrations]) down with them.
      # Adding importorskip here would be the wrong repair — it would turn the two-user
      # paywall-bypass tests into silent skips, which is the failure this workflow has
      # already suffered once.
      - name: Install
        run: pip install -e ".[api,dev]"
      # Same belt-and-braces guard as the `test` job: if the install line ever drifts back,
      # fail here with an unmistakable cause instead of four confusing test errors.
      - name: Guard — ownership suite must be runnable, not skippable
        run: python -c "import fastapi, jwt; print('api deps present')"
      - name: Apply migrations
        run: aeo migrate
      # -ra so a suite that quietly stops running shows up as skip reasons in the log.
      - name: Integration tests (DB-backed)
        run: pytest -q -ra tests/integration

  image:
    needs: [test, migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase repository name, but `github.repository` preserves the
      # owner's casing ("Sanjith72/aeo-pipeline") — which failed EVERY run on main with
      # `invalid tag ...: repository name must be lowercase`. There is no built-in lowercase
      # expression in workflow syntax, so normalise it here.
      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Build once, push with both the commit SHA and a moving 'latest' tag.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
