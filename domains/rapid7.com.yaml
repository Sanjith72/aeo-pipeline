# AEO Domain Configuration — rapid7.com
# Generated from provided research + live competitor fetches (2026-06-04)
#
# TAXONOMY NOTE: The tags below use only values currently valid in TaxonomyTag enum
# (mitre:*, cvss:*, cisa-kev:*). The following business-domain tags from your brief
# are not yet in the enum and should be added to blueprint.py when the enum is extended:
#   vulnerability-management, exposure-management, xdr, siem, mdr,
#   cloud-security, pentesting, threat-intelligence, zero-day, incident-response

domain: rapid7.com
engine_target: perplexity
freshness_days: 7

taxonomy_tags:
  - mitre:initial-access
  - mitre:execution
  - mitre:persistence
  - mitre:privilege-escalation
  - mitre:credential-access
  - mitre:exfiltration
  - cvss:critical
  - cvss:high
  - cisa-kev:listed

seed_queries:
  - "best vulnerability management platform for enterprise 2025"
  - "how to prioritize CVEs by exploitability and business risk"
  - "what is exposure management vs vulnerability management"
  - "Rapid7 InsightVM vs Tenable Nessus comparison"
  - "how does MDR differ from MSSP"
  - "MITRE ATT&CK coverage comparison for SIEM tools"
  - "what is attack surface management"
  - "how to reduce mean time to detect MTTD in SOC"
  - "best tools for cloud security posture management CSPM 2025"
  - "how to respond to a zero-day vulnerability before patch is available"

required_entities:
  - Rapid7
  - InsightVM
  - InsightIDR
  - Exposure Command
  - Command Platform
  - Metasploit
  - MDR
  - AttackerKB
  - Project Sonar
  - Intelligence Hub
  - MITRE ATT&CK
  - CVSS
  - CISA KEV
  - NIST CSF
  - XDR
  - SIEM
  - Incident Command

competitors:
