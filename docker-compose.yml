# Full AEO Studio stack in one command: Postgres + migrations + API + web UI.
#
#   cp .env.example .env                 # set POSTGRES_PASSWORD (and any API keys)
#   docker compose up -d --build         # db -> migrate -> api + web + worker
#   open http://localhost:3000           # the UI
#
# Optional add-ons:
#   docker compose run --rm app status            # ad-hoc CLI (the `cli` profile)

x-app: &app
  build: .
  image: aeo-crawler:latest
  env_file: .env
  environment:
    # Postgres is reachable as `db` on the compose network; password from .env.
    DATABASE_URL: postgresql://aeo:${POSTGRES_PASSWORD:-aeo}@db:5432/aeo
    AEO__CONFIG_DIR: /app/config
    # Default: the bundled `--profile llm` ollama container. Override DOCKER_LLM_HOST
    # (e.g. http://host.docker.internal:11434) to reuse an Ollama already on the host.
    AEO__LLM__HOST: ${DOCKER_LLM_HOST:-http://ollama:11434}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeo}
      POSTGRES_DB: aeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side publish is for inspection only (api/worker use the compose network).
      # Override POSTGRES_HOST_PORT when the host already runs Postgres on 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply pending migrations, then exit. Runs on `up`; api/worker wait for it.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  # The HTTP API (FastAPI) the UI calls.
  api:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The Next.js UI. It PROXIES API calls server-side (app/api/[...path]) so the secret key
  # never reaches the browser — so it needs the backend URL + key at RUNTIME (not baked).
  web:
    build:
      context: ./web
      args:
        # BUILD-time, not runtime: Next.js inlines NEXT_PUBLIC_* during `next build`, so
        # listing them under `environment:` below would do nothing and the image would ship
        # with user auth disabled (no Sign-in, every gate open). Set them in .env to enable
        # login + pack gating in the compose stack; leave blank for the anonymous-only stack.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: aeo-web:latest
    restart: unless-stopped
    environment:
      # Server-side only (the proxy reads these): the in-network API origin + the X-API-Key it
      # forwards. AEO__API__AUTH_KEY is unset locally → empty key → the open dev API accepts it.
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_KEY: ${AEO__API__AUTH_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Long-running drainer for the Postgres job queue. REQUIRED for the Phase 2 agent runtime
  # (it drains AGENT_RUN jobs → research/plan/build/critic → staged for human review); the deep
  # audit still runs in-process in the API. Part of the default stack so `docker compose up`
  # processes agent runs out of the box.
  worker:
    <<: *app
    command: ["worker", "--idle-sleep", "5"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ad-hoc CLI (enqueue / run / status). `docker compose run --rm app <cmd>`.
  app:
    <<: *app
    profiles: ["cli"]

  # Local LLM, part of the default stack. `ollama-init` below pulls the configured model
  # automatically on `up`; to add more models by hand:
  #   docker compose exec ollama ollama pull <model>
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: pull the model the app is configured to use, then exit. Idempotent — an
  # already-present model is a fast no-op; a fresh volume downloads it once. Without this
  # a new checkout comes up with an EMPTY ollama and every LLM feature (competitor
  # suggestions, draft personalization) silently degrades to its deterministic fallback.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    # Compose interpolates ${AEO__LLM__MODEL} from .env — the same var the app reads.
    command: ["${AEO__LLM__MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
