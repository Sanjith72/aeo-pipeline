# Full AEO Studio stack in one command: Postgres + migrations + API + web UI.
#
#   cp .env.example .env                 # set POSTGRES_PASSWORD (and any API keys)
#   docker compose up -d --build         # db -> migrate -> api -> web
#   open http://localhost:3000           # the UI
#
# Optional add-ons (off by default):
#   docker compose --profile worker up -d worker  # crawl-queue drainer (not needed for the UI)
#   docker compose run --rm app status            # ad-hoc CLI

x-app: &app
  build: .
  image: aeo-crawler:latest
  env_file: .env
  environment:
    # Postgres is reachable as `db` on the compose network; password from .env.
    DATABASE_URL: postgresql://aeo:${POSTGRES_PASSWORD:-aeo}@db:5432/aeo
    AEO__CONFIG_DIR: /app/config
    # Default: the bundled `--profile llm` ollama container. Override DOCKER_LLM_HOST
    # (e.g. http://host.docker.internal:11434) to reuse an Ollama already on the host.
    AEO__LLM__HOST: ${DOCKER_LLM_HOST:-http://ollama:11434}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeo}
      POSTGRES_DB: aeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side publish is for inspection only (api/worker use the compose network).
      # Override POSTGRES_HOST_PORT when the host already runs Postgres on 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply pending migrations, then exit. Runs on `up`; api/worker wait for it.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  # The HTTP API (FastAPI) the UI calls.
  api:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The Next.js UI. NEXT_PUBLIC_API_BASE is baked at build time and must be the URL the
  # browser uses — the host-published API port, not the in-network hostname.
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    image: aeo-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Long-running crawl-queue drainer — NOT needed for the UI flows (the deep audit runs
  # in-process in the API). Opt in: `--profile worker`.
  worker:
    <<: *app
    command: ["worker", "--idle-sleep", "5"]
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ad-hoc CLI (enqueue / run / status). `docker compose run --rm app <cmd>`.
  app:
    <<: *app
    profiles: ["cli"]

  # Local LLM, part of the default stack. Pull a model once:
  #   docker compose exec ollama ollama pull phi3
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama:
