[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeo-crawler"
version = "0.2.0"
description = "AEO crawler & scoring pipeline for cybersecurity content audits"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "crawl4ai>=0.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "trafilatura>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "ollama>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "PyYAML>=6.0.2",
    "typer>=0.12.0",
    "structlog>=24.1.0",
    "tenacity>=8.5.0",
    "textstat>=0.7.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]
# Optional OpenTelemetry OTLP export (obs/otel.py). Without it, OTEL is a no-op and
# the custom agent_traces table is the only tracer. Install with: pip install -e ".[otel]"
otel = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]
# Optional PDF export of the AEO reports (aeo report --pdf / aeo site-report --pdf).
pdf = ["reportlab>=4.0.0"]
# Optional HTTP API (SP-4): the FastAPI backend the guided UI calls. `aeo serve`.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
aeo = "aeo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous" Unicode (en-dash, curly quotes) in strings/docstrings/
# comments. This codebase uses typographic punctuation deliberately in user-facing output
# (e.g. "2–3 sentences", "Weeks 2–4") and prose, so those are intentional, not confusables.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer's API uses function calls (typer.Argument/Option) as parameter defaults
# by design, so B008 (function-call-in-default) is a false positive here.
"src/aeo/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
